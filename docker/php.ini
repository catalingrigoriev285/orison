; Orison production overrides, loaded after php.ini-production.
expose_php = Off
memory_limit = 256M

; Logo uploads are capped at 1 MB and favicons at 512 KB by validation.
upload_max_filesize = 4M
post_max_size = 8M

; The code inside the image never changes, so skip file stat checks.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
